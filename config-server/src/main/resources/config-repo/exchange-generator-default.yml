spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8082/realms/bank

  kafka:
    producer:
      enabled: true
      bootstrap-server: localhost:9092
      truststore-path: ${KAFKA_TRUST_STORE_PATH}
      truststore-password: ${KAFKA_TRUST_STORE_PASSWORD}
      keystore-path: ${KAFKA_KEY_STORE_PATH}
      keystore-password: ${KAFKA_KEY_STORE_PASSWORD}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh, busshutdown
  zipkin:
    tracing:
      endpoint: http://127.0.0.1:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1