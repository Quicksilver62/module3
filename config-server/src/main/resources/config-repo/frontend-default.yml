spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8082/realms/bank

keycloak:
  auth-server-url: http://localhost:8082
  realm: bank
  admin:
    realm: master
    client-id: admin-cli
    username: admin
    password: admin

management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh, busshutdown

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
    org.apache.http: WARN