spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/bank
        registration:
          keycloak:
            authorization-grant-type: authorization_code
            client-id: frontend
            client-secret: Udyd28MFJcB8XuBpAmI1fVI7PilNtNjH
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - openid
              - view_all
              - microprofile-jwt

  kafka:
    producer:
      enabled: true
      bootstrap-server: localhost:9092
      truststore-path: ${KAFKA_TRUST_STORE_PATH}
      truststore-password: ${KAFKA_TRUST_STORE_PASSWORD}
      keystore-path: ${KAFKA_KEY_STORE_PATH}
      keystore-password: ${KAFKA_KEY_STORE_PASSWORD}
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cloud:
    openfeign:
      oauth2:
        enabled: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

keycloak:
  auth-server-url: http://localhost:8082
  realm: bank
  admin:
    realm: master
    client-id: admin-cli
    username: admin
    password: admin

management:
  endpoints:
    web:
      exposure:
        include: refresh, busrefresh, busshutdown
  zipkin:
    tracing:
      endpoint: http://127.0.0.1:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

logging:
  level:
    feign.client: DEBUG