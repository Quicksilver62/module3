spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

  cloud:
    gateway:
      routes:
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/account-service/**
          filters:
            - TokenRelay
            - RewritePath=/account-service/(?<segment>.*), /${segment}
        - id: frontend
          uri: lb://frontend
          predicates:
            - Path=/frontend/**
          filters:
            - TokenRelay
            - RewritePath=/frontend/(?<segment>.*), /${segment}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/bank

