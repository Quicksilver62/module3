global:
  domain: module3.local

account-service:
  replicaCount: 1
  image:
    repository: account-service
    tag: "0.0.1-SNAPSHOT"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9002
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: account.module3.local
        paths:
          - path: /
            pathType: ImplementationSpecific
  # Database connection details passed to account-service configmap
  config:
    database_url: "jdbc:postgresql://localhost:5433/bank"
    database_username: "postgres"

