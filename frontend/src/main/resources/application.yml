server:
  port: 9001
spring:
  application:
    name: frontend
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-service
      import: "optional:configserver:"
  session:
    cookie:
      same-site: none
      secure: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka